[project]
name = "aks-api"
version = "0.1.0"
description = "Aks.pk e-commerce API"

authors = [
    { name = "mudassarhussain", email = "mudassarhussa1998@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "boto3>=1.43.126",
    "fastapi[standard]>=0.115",
    "pillow>=13.0.0",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.6",
    "pyjwt>=2.15.1",
    "python-multipart>=0.0.33",
    "redis>=5.2",
    "sqlalchemy[asyncio]>=2.0.36",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
